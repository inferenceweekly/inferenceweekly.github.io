# Sources scanned weekly by scripts/curate.py.
#
# url can be a feed OR a normal page (blog index, YouTube channel @handle):
# the script finds the page's RSS link itself.
#
# filter: true  -> only keep items whose title/summary match `keywords`
#                  (use for broad sources like NVIDIA, Hugging Face, arXiv, HN)
# filter: false -> keep everything (use for inference/agent-focused sources)
#
# The weekly curation issue lists any source that fails, so you can fix it.

keywords:
  - inference
  - serving
  - vllm
  - sglang
  - tensorrt
  - triton
  - kv cache
  - kv-cache
  - prefill
  - decode
  - speculative
  - quantiz
  - fp8
  - fp4
  - int4
  - batching
  - throughput
  - latency
  - ttft
  - tokens per second
  - disaggregat
  - paged attention
  - flashattention
  - flashinfer
  - kernel
  - cuda
  - gpu
  - llama.cpp
  - llm-d
  - dynamo
  - kserve
  - autoscal
  - agent
  - mcp
  - llm

articles:
  - name: vLLM Blog
    url: https://vllm.ai/blog
    filter: false
  - name: LMSYS / SGLang Blog
    url: https://lmsys.org/blog/
    filter: false
  - name: inference.net Blog
    url: https://inference.net/blog/
    filter: false
  - name: Red Hat Developer
    url: https://developers.redhat.com/blog/feed
    filter: true
  - name: PyTorch Blog
    url: https://pytorch.org/blog/
    filter: true
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    filter: true
  - name: NVIDIA Technical Blog
    url: https://developer.nvidia.com/blog/feed
    filter: true
  - name: The Pragmatic Engineer
    url: https://newsletter.pragmaticengineer.com/feed
    filter: true
  - name: SemiAnalysis
    url: https://newsletter.semianalysis.com/feed
    filter: true
  - name: Hacker News (50+ points)
    url: https://hnrss.org/newest?q=vllm+OR+sglang+OR+%22llm+inference%22+OR+%22inference+engine%22&points=50
    filter: false

papers:
  - name: arXiv cs.DC
    url: https://rss.arxiv.org/rss/cs.DC
    filter: true
  - name: arXiv cs.LG
    url: https://rss.arxiv.org/rss/cs.LG
    filter: true

# YouTube channels: paste the channel URL (https://www.youtube.com/@handle).
videos:
  - name: AI Engineer
    url: https://www.youtube.com/@aiDotEngineer
    filter: false
  - name: AAIF Agentic Conversations
    url: https://www.youtube.com/@AAIFAgenticConversations
    filter: false
  - name: AAIF Live
    url: https://www.youtube.com/@AAIFLive-x1r
    filter: false
  - name: Agentic AI Foundation
    url: https://www.youtube.com/@AgenticAI-Foundation
    filter: false
  - name: LangChain
    url: https://www.youtube.com/@LangChain
    filter: false
  - name: Baseten
    url: https://www.youtube.com/@baseten
    filter: false
  - name: Caleb Writes Code
    url: https://www.youtube.com/@CalebWritesCode
    filter: false
  - name: Andrej Karpathy
    url: https://www.youtube.com/@AndrejKarpathy
    filter: false

# GitHub releases (Atom feed per repo). Pre-releases/nightlies are skipped.
repos:
  - vllm-project/vllm
  - sgl-project/sglang
  - NVIDIA/TensorRT-LLM
  - ai-dynamo/dynamo
  - llm-d/llm-d
  - kserve/kserve
  - ggml-org/llama.cpp
  - flashinfer-ai/flashinfer
  - vllm-project/production-stack
  - triton-lang/triton

# Curated GitHub lists (awesome-lists and similar): each week the README is
# compared with how it looked a week earlier and newly added links are listed.
lists:
  - name: AI Inference Resources (aerlabsAI)
    repo: aerlabsAI/ai-inference-resources
