site_name: Inference Weekly
site_url: https://inferenceweekly.github.io/
site_description: "A weekly, hand-curated digest of inference engineering: articles, talks, papers and repos on serving LLMs fast, cheap and reliably."
site_author: Atil Sensalduz
copyright: Copyright &copy; Inference Weekly

repo_url: https://github.com/inferenceweekly/inferenceweekly.github.io
repo_name: inferenceweekly/inferenceweekly.github.io
edit_uri: ""

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/lightning-bolt
  features:
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search
  - rss:
      match_path: "issues/.*"
      date_from_meta:
        as_creation: date
      comments_path: ""
      feed_ttl: 1440
      image: ""

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/solid/rss
      link: /feed_rss_created.xml
      name: RSS feed
    - icon: fontawesome/solid/envelope
      link: https://buttondown.com/inferenceweekly
      name: Subscribe
    - icon: fontawesome/brands/github
      link: https://github.com/inferenceweekly
      name: GitHub

extra_css:
  - assets/extra.css

hooks:
  - hooks/issues_nav.py

# The sidebar (nav) is generated from docs/issues/ by hooks/issues_nav.py.
