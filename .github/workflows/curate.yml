name: Weekly curation

# Every Friday 09:00 Istanbul time (06:00 UTC): collect the week's candidates
# and open a GitHub issue to triage them before Monday's newsletter.
on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look"
        default: "7"

permissions:
  contents: read
  issues: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/curate.py --days "${{ github.event.inputs.days || '7' }}" -o candidates.md
      - name: Open triage issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create curation --color 5319E7 --description "Weekly link candidates" 2>/dev/null || true
          gh issue create \
            --title "Candidates: week of $(date -u +%Y-%m-%d)" \
            --label curation \
            --body-file candidates.md
